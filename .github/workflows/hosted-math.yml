name: Hosted mathematics
run-name: Inspect the committed GitHub mathematics

on:
  workflow_dispatch:
    inputs:
      helper_bundle:
        description: "Gzip/base64 JSON of the two hash-pinned inspection helpers"
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate and materialize inspection helpers
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          revision = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Invalid commit identifier')
          observed = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if observed != revision:
              raise SystemExit('Checkout differs from the dispatched commit')
          expected = {
              'capture_hosted_math.cjs': '49182eaf354e86f685a4976814d672de5d7329a2d9e42f62a5227e2bc07c2d18',
              'check_rendered_math.py': 'edbc2d72af94e96b78166d74b66fcea150134f2f3ebaaea121e9057768e1dbfe',
          }
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          encoded = event['inputs']['helper_bundle']
          if not isinstance(encoded, str) or len(encoded) > 60000:
              raise SystemExit('Invalid helper bundle size')
          packed = base64.b64decode(encoded, validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              raw = stream.read(200001)
          if len(raw) > 200000:
              raise SystemExit('Helper bundle exceeds the decoded size limit')
          helpers = json.loads(raw)
          if not isinstance(helpers, dict) or set(helpers) != set(expected):
              raise SystemExit('Unexpected helper inventory')
          checked = {}
          for name, digest in expected.items():
              if not isinstance(helpers[name], str):
                  raise SystemExit('Invalid helper encoding')
              content = helpers[name].encode('utf-8')
              if hashlib.sha256(content).hexdigest() != digest:
                  raise SystemExit('Inspection helper hash mismatch')
              checked[name] = content
          destination = Path(os.environ['RUNNER_TEMP']) / 'hosted-tools'
          destination.mkdir(exist_ok=False)
          for name, content in checked.items():
              (destination / name).write_bytes(content)
          print('Both inspection helpers match their pinned hashes.')
          PY

      - name: Install the browser and comparison dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture and compare every tracked Markdown page
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/hosted-deps/node_modules" \
            node "$RUNNER_TEMP/hosted-tools/capture_hosted_math.cjs" \
              --root "$GITHUB_WORKSPACE" \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$GITHUB_SHA" \
              --contract "$GITHUB_WORKSPACE/verification/hosted-contract.json" \
              --output "$RUNNER_TEMP/hosted-evidence" \
              --python python3

      - name: Preserve the actual inspection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-math-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-evidence/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
